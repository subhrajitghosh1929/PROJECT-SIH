      8%   { opacity: 0.9; }

      const [screen, setScreen] = useState("home");
      const [destination, setDestination] = useState("");
      const [tripKey, setTripKey] = useState("home");
      const [trackingOption, setTrackingOption] = useState(null);
      const [theme, setTheme] = useState("dark");
      const [toast, setToast] = useState(null);

      const [posts, setPosts] = useState([
        { id: "c1", userName: "Amit K.", type: "platform", routeLabel: "Metro · Blue", message: "Platform 2 closed for maintenance at Sector V — board from Platform 1 instead.", time: "35 min ago", confirms: 14 },
        { id: "c2", userName: "Debjit M.", type: "crowd", routeLabel: "Route 12", message: "Packed beyond normal today — standing room only near Karunamoyee.", time: "10 min ago", confirms: 6 },
        { id: "c3", userName: "Pooja B.", type: "delay", routeLabel: "Route 47", message: "Stuck in traffic near the Karunamoyee crossing, moving slowly.", time: "18 min ago", confirms: 9 },
      ]);

      const [alerts, setAlerts] = useState([
        { id: "a1", title: "Beat tonight's rush", message: "Head out in the next 8 min to skip the 7:00 PM crowd surge on Route 12.", time: "Just now", routeLabel: "Route 12" },
        { id: "a2", title: "Route 12 running late", message: "Traffic near Karunamoyee is pushing arrivals back by about 8 minutes.", time: "2 min ago", routeLabel: "Route 12" },
        { id: "a3", title: "Metro Blue Line disruption", message: "Signal maintenance near Phoolbagan. Delays of 10+ minutes.", time: "12 min ago", routeLabel: "Metro · Blue" },
      ]);

      const fireToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2400);
      };

      const goToRoutes = (key, label) => {
        setTripKey(key);
        setDestination(label);
        setScreen("routes");
      };

      const handlePickRoute = (opt) => {
        setTrackingOption(opt);
        setScreen("track");
      };

      return (
        <div className={`tm-root ${theme === "light" ? "tm-light" : ""}`}>
          {/* Header Bar */}
          <div
            onClick={() => setScreen("admin")}
            className="px-5 py-2.5 flex items-center justify-between text-[11px] font-medium tm-hover"
            style={{ background: "rgba(0,0,0,0.3)", borderBottom: "1px solid var(--tm-border)" }}
            title="Click to open Admin Console"
          >
            <span className="flex items-center gap-1.5" style={{ color: "var(--tm-accent)" }}>
              <Icon name="shield" size={13} /> SIH 2026 TransitMate
            </span>
            <span
              className="flex items-center gap-1 px-2 py-0.5 rounded-full font-mono text-[9px]"
              style={{ background: "var(--tm-teal-soft)", color: "var(--tm-teal)", border: "1px solid var(--tm-teal-border)" }}
            >
              <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--tm-teal)', display: 'inline-block' }}></span>
              OFFLINE READY
            </span>
          </div>

          {/* Screen Content */}
          <div className="flex-1 flex flex-col min-h-0 overflow-y-auto">
            {screen === "home" && (
              <div className="p-6 flex flex-col gap-6 tm-fade-in">
                <div className="flex items-center justify-between">
                  <div>
                    <p className="tm-mono text-xs" style={{ color: "var(--tm-muted)" }}>TUE · 6:42 PM</p>
                    <h1 className="tm-display text-2xl font-semibold mt-1">Evening, {userName}</h1>
                    <p className="text-xs mt-0.5" style={{ color: "var(--tm-muted)" }}>Salt Lake, Sector V</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setScreen("admin")} className="tm-card-alt p-2 rounded-full" title="Admin Console">
                      <Icon name="shield" size={16} color="var(--tm-accent)" />
                    </button>
                    <button onClick={() => setScreen("habits")} className="tm-card-alt p-2 rounded-full tm-mono text-xs font-bold" style={{ color: 'var(--tm-accent)' }}>
                      R
                    </button>
                  </div>
                </div>

                {/* Search box */}
                <div className="tm-card-alt p-3.5 rounded-2xl flex items-center gap-3">
                  <Icon name="pin" size={16} color="var(--tm-accent)" />
                  <input
                    value={destination}
                    onChange={(e) => setDestination(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && goToRoutes("home", destination || "Home")}
                    placeholder="Where are you headed?"
                    className="tm-input flex-1 bg-transparent outline-none text-sm"
                    style={{ color: "var(--tm-heading)" }}
                  />
                  <button onClick={() => goToRoutes("home", destination || "Home")} className="p-2 rounded-full" style={{ background: "var(--tm-accent)" }}>
                    <Icon name="search" size={13} color="var(--tm-on-accent)" />
                  </button>
                </div>

                {/* AI Rush Hour Advisory */}
                <div className="p-4 rounded-2xl flex gap-3 items-start" style={{ background: "var(--tm-amber-soft)", border: "1px solid var(--tm-amber-border)" }}>
                  <Icon name="sparkles" size={18} color="var(--tm-amber)" className="shrink-0" />
                  <div>
                    <p className="text-sm font-medium" style={{ color: "var(--tm-heading)" }}>Beat the rush today</p>
                    <p className="text-xs mt-1 leading-relaxed">
                      You usually leave at 6:50 PM. Head out in the next <span className="tm-mono" style={{ color: "var(--tm-amber)" }}>8 min</span> to skip the 7:00 PM crowd surge on Route 12.
                    </p>
                  </div>
                </div>

                {/* Frequent Trips */}
                <div>
                  <p className="text-xs uppercase tm-eyebrow inline-block px-2 py-1 rounded-md mb-3">Frequent trips</p>
                  <div className="flex flex-col gap-2.5">
                    {QUICK_DESTINATIONS.map((q) => (
                      <div key={q.key} onClick={() => goToRoutes(q.key, q.sub)} className="tm-card tm-hover p-3.5 rounded-xl flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="p-2 rounded-lg" style={{ background: "var(--tm-accent-soft)" }}>
                            <Icon name={q.icon} size={15} color="var(--tm-accent)" />
                          </div>
                          <div>
                            <p className="text-sm font-medium" style={{ color: "var(--tm-heading)" }}>{q.label}</p>
                            <p className="text-xs" style={{ color: "var(--tm-muted)" }}>{q.sub}</p>
                          </div>
                        </div>
                        <div className="text-right">
                          <p className="text-sm tm-mono" style={{ color: "var(--tm-teal)" }}>{q.eta}</p>
                          <p className="text-[10px]" style={{ color: "var(--tm-muted)" }}>{q.route}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Stats */}
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="tm-card-alt p-3.5 rounded-xl">
                    <p className="text-xs" style={{ color: "var(--tm-muted)" }}>Saved this week</p>
                    <p className="tm-mono text-lg font-semibold mt-0.5" style={{ color: "var(--tm-teal)" }}>₹340</p>
                  </div>
                  <div className="tm-card-alt p-3.5 rounded-xl">
                    <p className="text-xs" style={{ color: "var(--tm-muted)" }}>Avg. wait time</p>
                    <p className="tm-mono text-lg font-semibold mt-0.5" style={{ color: "var(--tm-heading)" }}>4 min</p>
                  </div>
                </div>
              </div>
            )}

            {screen === "routes" && (
              <div className="p-6 flex flex-col gap-4 tm-fade-in">
                <button onClick={() => setScreen("home")} className="tm-card-alt w-8 h-8 rounded-full flex items-center justify-center">
                  <Icon name="arrowLeft" size={15} />
                </button>
                <div>
                  <p className="text-xs tm-mono" style={{ color: "var(--tm-muted)" }}>SALT LAKE, SECTOR V →</p>
                  <h1 className="tm-display text-xl font-semibold mt-0.5">{ROUTE_SETS[tripKey]?.title || "Destination"}</h1>
                </div>
                <div className="flex flex-col gap-3">
                  {(ROUTE_SETS[tripKey]?.options || ROUTE_SETS.default.options).map((opt) => (
                    <div key={opt.key} onClick={() => handlePickRoute(opt)} className="tm-card tm-hover p-4 rounded-2xl flex flex-col gap-2.5">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] uppercase px-2 py-0.5 rounded-md tm-eyebrow font-mono">{opt.tag}</span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ background: CROWD_STYLE[opt.crowd]?.bg, color: CROWD_STYLE[opt.crowd]?.color }}>
                          {opt.crowd} Crowd
                        </span>
                      </div>
                      <p className="text-sm font-semibold" style={{ color: "var(--tm-heading)" }}>{opt.mode}</p>
                      <p className="text-xs leading-relaxed" style={{ color: "var(--tm-body)" }}>{opt.detail}</p>
                      <div className="flex items-center justify-between pt-2 border-t" style={{ borderColor: "var(--tm-border)" }}>
                        <span className="text-xs tm-mono flex items-center gap-1"><Icon name="clock" size={12} /> {opt.time}</span>
                        <span className="text-xs tm-mono flex items-center gap-1 font-semibold" style={{ color: "var(--tm-heading)" }}>{opt.fare}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {screen === "track" && trackingOption && (
              <div className="p-6 flex flex-col gap-4 tm-fade-in">
                <button onClick={() => setScreen("routes")} className="tm-card-alt w-8 h-8 rounded-full flex items-center justify-center">
                  <Icon name="arrowLeft" size={15} />
                </button>
                <div className="flex items-center justify-between">
                  <div>
                    <p className="text-xs tm-mono" style={{ color: "var(--tm-accent)" }}>LIVE TRACKING &amp; SEAT CROWD</p>
                    <h1 className="tm-display text-xl font-semibold mt-0.5">{trackingOption.mode}</h1>
                  </div>
                  <span className="text-xs tm-mono px-2 py-1 rounded-lg" style={{ background: "var(--tm-teal-soft)", color: "var(--tm-teal)" }}>
                    In 4 min
                  </span>
                </div>

                {/* Coach crowd matrix */}
                <div className="tm-card p-4 rounded-2xl flex flex-col gap-2.5">
                  <p className="text-xs font-semibold" style={{ color: "var(--tm-heading)" }}>Coach-by-Coach Platform Gate Intelligence</p>
                  <p className="text-[11px]" style={{ color: "var(--tm-muted)" }}>Measured from your usual entry gate (Gate 3):</p>
                  <div className="grid grid-cols-3 gap-2 mt-1">
                    {[
                      { id: "Gate 1", coach: "Coach 1", lvl: "Low", dist: "48m behind" },
                      { id: "Gate 2", coach: "Coach 2", lvl: "Low", dist: "24m behind" },
                      { id: "Gate 3", coach: "Coach 3 (Best)", lvl: "Low", dist: "You are here" },
                      { id: "Gate 4", coach: "Coach 4", lvl: "Medium", dist: "24m ahead" },
                      { id: "Gate 5", coach: "Coach 5", lvl: "Low", dist: "48m ahead" },
                      { id: "Gate 6", coach: "Coach 6", lvl: "High", dist: "72m ahead" },
                    ].map((c) => (
                      <div key={c.id} className="p-2.5 rounded-xl text-center" style={{ background: CROWD_STYLE[c.lvl]?.bg, border: c.id.includes("Best") ? "1px solid var(--tm-teal)" : "1px solid var(--tm-border)" }}>
                        <Icon name="armchair" size={15} color={CROWD_STYLE[c.lvl]?.color} />
                        <p className="text-[11px] font-semibold mt-1" style={{ color: "var(--tm-heading)" }}>{c.coach}</p>
                        <p className="text-[9px] tm-mono" style={{ color: CROWD_STYLE[c.lvl]?.color }}>{c.lvl}</p>
                        <p className="text-[8px] mt-0.5" style={{ color: "var(--tm-muted)" }}>{c.dist}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="tm-card p-4 rounded-2xl">
                  <p className="text-xs font-semibold mb-2" style={{ color: "var(--tm-heading)" }}>Route Itinerary</p>
                  {trackingOption.stops.map((s, idx) => (
                    <div key={s} className="flex items-center gap-2 py-1.5 text-xs">
                      <Icon name="check" size={13} color="var(--tm-teal)" />
                      <span style={{ color: idx === 0 ? "var(--tm-accent)" : "var(--tm-heading)" }}>{s}</span>
                    </div>
                  ))}
                </div>

                <button onClick={() => { fireToast("Trip recorded to habits history!"); setScreen("home"); }} className="w-full py-3 rounded-xl text-xs font-medium" style={{ background: "var(--tm-accent)", color: "var(--tm-on-accent)" }}>
                  Complete Trip
                </button>
              </div>
            )}

            {screen === "alerts" && (
              <div className="p-6 flex flex-col gap-4 tm-fade-in">
                <h1 className="tm-display text-xl font-semibold">Live Disruptions &amp; Alerts</h1>
                <div className="flex flex-col gap-3">
                  {alerts.map((a) => (
                    <div key={a.id} className="tm-card p-4 rounded-2xl flex items-start gap-3">
                      <div className="p-2 rounded-lg" style={{ background: "var(--tm-amber-soft)" }}>
                        <Icon name="alert" size={16} color="var(--tm-amber)" />
                      </div>
                      <div className="flex-1">
                        <div className="flex items-center justify-between">
                          <p className="text-sm font-semibold" style={{ color: "var(--tm-heading)" }}>{a.title}</p>
                          <span className="text-[10px]" style={{ color: "var(--tm-muted)" }}>{a.time}</span>
                        </div>
                        <p className="text-xs mt-1 leading-relaxed">{a.message}</p>
                        <span className="text-[10px] px-2 py-0.5 rounded tm-card-alt inline-block mt-2">{a.routeLabel}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {screen === "community" && (
              <div className="p-6 flex flex-col gap-4 tm-fade-in">
                <h1 className="tm-display text-xl font-semibold">Commuter Community</h1>
                <div className="flex gap-2">
                  <button onClick={() => {
                    setPosts([{ id: `c-${Date.now()}`, userName: "You", type: "delay", routeLabel: "Route 12", message: "Bus held up near Tank No. 4.", time: "Just now", confirms: 1 }, ...posts]);
                    fireToast("Report posted!");
                  }} className="flex-1 py-2.5 rounded-xl text-xs font-medium tm-card-alt flex items-center justify-center gap-1.5">
                    <Icon name="plus" size={13} /> Quick Report Delay
                  </button>
                </div>
                <div className="flex flex-col gap-3">
                  {posts.map((p) => (
                    <div key={p.id} className="tm-card p-4 rounded-2xl flex flex-col gap-2">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-medium" style={{ color: "var(--tm-heading)" }}>{p.userName}</span>
                        <span style={{ color: "var(--tm-muted)" }}>{p.time}</span>
                      </div>
                      <p className="text-xs leading-relaxed" style={{ color: "var(--tm-body)" }}>{p.message}</p>
                      <div className="flex items-center justify-between pt-2 border-t" style={{ borderColor: "var(--tm-border)" }}>
                        <span className="text-[10px] tm-card-alt px-2 py-0.5 rounded">{p.routeLabel}</span>
                        <button onClick={() => {
                          setPosts(posts.map(item => item.id === p.id ? { ...item, confirms: item.confirms + 1 } : item));
                          fireToast("Confirmed!");
                        }} className="text-xs flex items-center gap-1" style={{ color: "var(--tm-accent)" }}>
                          <Icon name="thumbsUp" size={12} /> Still happening · {p.confirms}
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {screen === "habits" && (
              <div className="p-6 flex flex-col gap-4 tm-fade-in">
                <button onClick={() => setScreen("home")} className="tm-card-alt w-8 h-8 rounded-full flex items-center justify-center">
                  <Icon name="arrowLeft" size={15} />
                </button>
                <h1 className="tm-display text-xl font-semibold">Commuter Habits Analyzer</h1>
                <div className="grid grid-cols-2 gap-2.5">
                  <div className="tm-card-alt p-3.5 rounded-xl">
                    <p className="text-xs" style={{ color: "var(--tm-muted)" }}>Trips Taken</p>
                    <p className="tm-mono text-lg font-bold mt-0.5" style={{ color: "var(--tm-heading)" }}>8 Trips</p>
                  </div>
                  <div className="tm-card-alt p-3.5 rounded-xl">
                    <p className="text-xs" style={{ color: "var(--tm-muted)" }}>Saved vs. Cab</p>
                    <p className="tm-mono text-lg font-bold mt-0.5" style={{ color: "var(--tm-teal)" }}>₹340</p>
                  </div>
                </div>
                <div className="p-4 rounded-2xl" style={{ background: "var(--tm-accent-soft)", border: "1px solid var(--tm-accent-border)" }}>
                  <p className="text-xs font-semibold" style={{ color: "var(--tm-heading)" }}>AI Pattern Insight</p>
                  <p className="text-xs mt-1 leading-relaxed">Switching to Metro Blue Line on evening returns saves you 14 minutes and ₹45 daily compared to peak bus traffic.</p>
                </div>
              </div>
            )}

            {screen === "admin" && (
              <div className="p-6 flex flex-col gap-4 tm-fade-in">
                <button onClick={() => setScreen("home")} className="tm-card-alt w-8 h-8 rounded-full flex items-center justify-center">
                  <Icon name="arrowLeft" size={15} />
                </button>
                <div className="flex items-center justify-between">
                  <div>
                    <p className="text-xs tm-mono" style={{ color: "var(--tm-accent)" }}>TRANSIT AUTHORITY</p>
                    <h1 className="tm-display text-xl font-semibold mt-0.5">Admin &amp; SIH Simulator</h1>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full" style={{ background: "var(--tm-teal-soft)", color: "var(--tm-teal)" }}>
                    Live Engine
                  </span>
                </div>

                {/* Delay Injector for Pitch */}
                <div className="tm-card p-4 rounded-2xl flex flex-col gap-3">
                  <p className="text-xs font-semibold" style={{ color: "var(--tm-heading)" }}>SIH Delay Injection Tool</p>
                  <p className="text-[11px]" style={{ color: "var(--tm-muted)" }}>Trigger artificial delay during live pitch to show dynamic rerouting:</p>
                  <div className="flex gap-2">
                    {[5, 10, 15].map((m) => (
                      <button key={m} onClick={() => {
                        setAlerts([{ id: `a-${Date.now()}`, title: `Simulated Delay: +${m}m`, message: `Traffic delay injected on Route 12 corridor.`, time: "Just now", routeLabel: "Route 12" }, ...alerts]);
                        fireToast(`Injected +${m}m delay on Route 12!`);
                      }} className="flex-1 py-2 rounded-lg text-xs font-mono tm-card-alt" style={{ border: "1px solid var(--tm-border)" }}>
                        +{m} min
                      </button>
                    ))}
                  </div>
                </div>

                <div className="tm-card p-4 rounded-2xl flex flex-col gap-2">
                  <p className="text-xs font-semibold" style={{ color: "var(--tm-heading)" }}>Active Corridors</p>
                  {["Route 12 (Salt Lake)", "Metro Blue Line", "Route 47 (Esplanade)"].map((c) => (
                    <div key={c} className="flex items-center justify-between text-xs py-1">
                      <span>{c}</span>
                      <span className="text-[10px] font-mono" style={{ color: "var(--tm-teal)" }}>Optimal (28 km/h)</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Navigation Bar */}
          <div className="tm-card-alt border-t px-4 py-3 flex items-center justify-between" style={{ borderColor: "var(--tm-border)" }}>
            {[
              { key: "home", label: "Home", icon: "home" },
              { key: "routes", label: "Routes", icon: "compass" },
              { key: "track", label: "Track", icon: "train" },
              { key: "alerts", label: "Alerts", icon: "bell" },
              { key: "community", label: "Community", icon: "users" },
            ].map((item) => (
              <button
                key={item.key}
                onClick={() => {
                  if (item.key === "track" && !trackingOption) {
                    setTrackingOption(ROUTE_SETS.home.options[0]);
                  }
                  setScreen(item.key);
                }}
                className={`flex flex-col items-center gap-1 flex-1 py-1 ${screen === item.key ? "tm-nav-active" : "tm-nav-inactive"}`}
              >
                <Icon name={item.icon} size={18} />
                <span className="text-[10px]">{item.label}</span>
              </button>
            ))}
          </div>

          {toast && <div className="tm-toast">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TransitMateOfflineApp />);
  </script>
</body>
</html>
